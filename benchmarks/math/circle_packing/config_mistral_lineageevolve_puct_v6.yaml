checkpoint_interval: 10
diff_based_generation: false
evaluator:
  cascade_evaluation: true
  cascade_thresholds:
  - 0.5
  - 0.75
  timeout: 60
language: python
llm:
  api_base: https://api.mistral.ai/v1
  api_key: ${MISTRAL_API_KEY}
  evaluator_models:
  - api_base: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY}
    name: zai-glm-5-3-flash
    weight: 1.0
  guide_models:
  - api_base: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY}
    name: zai-glm-5-3-flash
    weight: 1.0
  max_tokens: 8000
  models:
  - api_base: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY}
    name: zai-glm-5-3-flash
    weight: 1.0
  reasoning_effort: low
  retries: 3
  retry_delay: 5
  temperature: 0.2
  timeout: 300
max_iterations: 100
max_solution_length: 60000
monitor:
  enabled: false
prompt:
  system_message: 'You are an expert mathematician specializing in circle packing problems and computational geometry. Your task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square, maximizing the sum of their radii.

    Key insights:

    - Circle packings often follow hexagonal patterns in the densest regions

    - Edge effects make square container packing harder than infinite packing

    - Circles can be placed in layers or shells when confined to a square

    '
search:
  database:
    archive_size: 25
    num_islands: 4
    population_size: 60
    paradigm_parent: tree
    import_as_roots: false
  num_context_programs: 3
  type: lineageevolve_puct
